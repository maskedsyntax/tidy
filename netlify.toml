# Marketing site lives in /website (SvelteKit static export).
# Without this, Netlify deploys the Flutter monorepo root → no index.html → 404.

[build]
  base = "website"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# Prerendered static site — only needed if you add client-side routes later.
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
